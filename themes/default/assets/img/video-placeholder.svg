<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#615dfa" />
      <stop offset="100%" stop-color="#4e49eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- Subtle Film Strip Grid Patterns -->
  <g opacity="0.05" fill="#ffffff">
    <rect x="20" y="20" width="760" height="410" rx="16" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="16 16"/>
    <circle cx="200" cy="150" r="180" />
    <circle cx="600" cy="300" r="220" />
  </g>

  <!-- Center Video Play Icon Badge -->
  <g transform="translate(400, 225)" filter="url(#glow)">
    <circle cx="0" cy="0" r="54" fill="url(#btn-grad)" />
    <path d="M-12 -20 L22 0 L-12 20 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Decorative Video Tag -->
  <g transform="translate(400, 340)" opacity="0.7">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#a6adc8" text-anchor="middle" letter-spacing="2">
      MYADS VIDEO
    </text>
  </g>
</svg>
