# =============================================================================
# MyAds — Recommended Nginx Security Configuration
# =============================================================================
# IMPORTANT: This file should be included in your Nginx server block.
# Since Nginx does NOT read .htaccess files, these rules are REQUIRED
# to prevent access to sensitive files like .env, composer.json, etc.
#
# Usage:  include /path/to/myads/nginx-security.conf;
#         (inside your server { ... } block)
# =============================================================================

# Block access to .env files (including /env without the dot)
location ~ ^/\.env {
    deny all;
    return 403;
}
location = /env {
    deny all;
    return 403;
}

# Block access to hidden files and directories (.git, .editorconfig, etc.)
location ~ /\. {
    deny all;
    return 403;
}

# Block access to composer files
location ~ ^/composer\.(json|lock)$ {
    deny all;
    return 403;
}

# Block access to artisan CLI
location = /artisan {
    deny all;
    return 403;
}

# Block access to phpunit.xml
location = /phpunit.xml {
    deny all;
    return 403;
}

# Block access to sensitive directories
location ~ ^/(vendor|storage|bootstrap|config|database|app|routes|tests|brain|~)/ {
    deny all;
    return 403;
}

# Block access to SECURITY.md
location = /SECURITY.md {
    deny all;
    return 403;
}
